version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - JWT_SECRET_KEY=super_secret_key_for_demo_purposes_only
    extra_hosts:
      - "host.docker.internal:host-gateway"
